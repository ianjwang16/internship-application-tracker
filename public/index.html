<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Internship Application Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Internship Application Tracker</h1>

        <h2>Add Application</h2>
        <div class="stats">
    <div>
        <strong>Total:</strong>
        <span id="totalCount">0</span>
    </div>

    <div>
        <strong>Applied:</strong>
        <span id="appliedCount">0</span>
    </div>

    <div>
        <strong>Interview:</strong>
        <span id="interviewCount">0</span>
    </div>

    <div>
        <strong>Offer:</strong>
        <span id="offerCount">0</span>
    </div>

    <div>
        <strong>Rejected:</strong>
        <span id="rejectedCount">0</span>
    </div>

    <div>
    <strong>Interview Rate:</strong>
    <span id="interviewRate">0%</span>
</div>

<div>
    <strong>Offer Rate:</strong>
    <span id="offerRate">0%</span>
</div>

</div>

<input
    type="text"
    id="searchCompany"
    placeholder="Search by company"
>
<form id="applicationForm">

    <div class="form-row">

        <input
            type="text"
            id="company"
            placeholder="Company"
            required
        >

        <input
            type="text"
            id="position"
            placeholder="Position"
            required
        >

        <select id="status">
            <option value="Saved">Saved</option>
            <option value="Applied">Applied</option>
            <option value="OA">OA</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
        </select>

        <input
            type="text"
            id="location"
            placeholder="Location"
        >

    </div>


    <div class="form-row second-row">

        <input
            type="text"
            id="jobLink"
            placeholder="Job Link"
        >

        <input
            type="date"
            id="dateApplied"
        >

        <input
            type="text"
            id="notes"
            placeholder="Notes"
        >

        <button type="submit" id="submitButton">
            Add Application
        </button>

    </div>

</form>
        


        <h2>My Applications</h2>
        <label for="filterStatus">Filter by status:</label>

<select id="filterStatus">
    <option value="">All</option>
    <option value="Saved">Saved</option>
    <option value="Applied">Applied</option>
    <option value="OA">OA</option>
    <option value="Interview">Interview</option>
    <option value="Offer">Offer</option>
    <option value="Rejected">Rejected</option>
</select>

<label for="sortBy">Sort by:</label>

<select id="sortBy">
    <option value="newest">Newest</option>
    <option value="company">Company A-Z</option>
    <option value="status">Status</option>
</select>

<p id="emptyMessage" style="display: none;">
    No applications found.
</p>
        <table>

            <thead>
                <tr>
    <th>Company</th>
    <th>Position</th>
    <th>Status</th>
    <th>Location</th>
    <th>Date Applied</th>
    <th>Job Link</th>
    <th>Actions</th>
</tr>
            </thead>

            <tbody id="applicationTable">
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
